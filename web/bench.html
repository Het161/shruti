<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F2F1ED" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131313" media="(prefers-color-scheme: dark)">
<title>SHRUTI — bench</title>
<link rel="stylesheet" href="/styles.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='13' font-size='13'>◉</text></svg>">
</head>
<body>
<div class="shell">

  <header class="masthead">
    <span class="wordmark">SHRUTI<span class="dev">·</span></span>
    <span class="tagline">Bench — latest measured run against the deployed system.</span>
    <nav class="pages">
      <a href="/">Instrument</a>
      <a href="/method.html">Method</a>
      <a href="/bench.html" aria-current="page">Bench</a>
    </nav>
  </header>

  <section class="panel">
    <div class="panel-label">Verdict</div>
    <div class="reading">
      <div class="reading-total"><span id="headline">—</span><span class="unit">ms P100</span></div>
      <div class="reading-meta" id="verdict"></div>
    </div>
    <div class="score-nums" id="meta"></div>
  </section>

  <section class="panel">
    <div class="panel-label">SLOs</div>
    <div class="scroll-x" id="slo">loading…</div>
  </section>

  <section class="panel">
    <div class="panel-label">Per stage</div>
    <div class="scroll-x" id="stages">loading…</div>
  </section>

  <section class="panel">
    <div class="panel-label">Per language</div>
    <div class="scroll-x" id="langs">loading…</div>
  </section>

  <div class="status-strip" id="status"></div>
</div>

<script>
const $ = (id) => document.getElementById(id);

function table(headers, rows) {
  const th = headers.map((h) => `<th>${h}</th>`).join("");
  const tr = rows
    .map((r) => "<tr>" + r.map((c, i) => `<td class="${i ? "num" : ""}">${c}</td>`).join("") + "</tr>")
    .join("");
  return `<table class="data"><thead><tr>${th}</tr></thead><tbody>${tr}</tbody></table>`;
}

const COLS = ["n", "p50", "p70", "p90", "p99", "p100"];

fetch("/results/deployed-latest.json")
  .then((r) => (r.ok ? r.json() : Promise.reject(new Error("no benchmark artifact yet"))))
  .then((d) => {
    const server = d.slo.server_side_ms || {};
    $("headline").textContent = server.p100 != null ? server.p100.toFixed(1) : "—";

    const met = server.p100 != null && server.p100 < 200;
    $("verdict").innerHTML = `200ms P100 target (server-side): <b style="color:var(--${
      met ? "trace" : "refuse"
    })">${met ? "MET" : "MISSED"}</b>`;

    const c = d.counts;
    $("meta").textContent =
      `${c.measured} measured · ${c.answered} answered · ${c.refused} refused · ${c.errors} errors · ` +
      `${c.warmup_excluded} warmup excluded · cold start ${d.cold_start_first_contact_ms ?? "—"}ms · ` +
      `${d.config.search_mode}/${d.config.lane} · ${new Date(d.measured_at_unix * 1000).toISOString()}`;

    $("slo").innerHTML = table(
      ["SLO", ...COLS],
      Object.entries(d.slo)
        .filter(([, v]) => v && v.n)
        .map(([k, v]) => [k, ...COLS.map((c) => (v[c] != null ? v[c] : "—"))])
    );

    $("stages").innerHTML = table(
      ["Stage", ...COLS],
      Object.entries(d.stages_ms).map(([k, v]) => [k, ...COLS.map((c) => (v[c] != null ? v[c] : "—"))])
    );

    $("langs").innerHTML = table(
      ["Language", ...COLS],
      Object.entries(d.per_language_pipeline_ms).map(([k, v]) => [
        k,
        ...COLS.map((c) => (v[c] != null ? v[c] : "—")),
      ])
    );

    $("status").innerHTML = `target <b>${d.target_url}</b> · corpus <b>${
      d.health && d.health.corpus_passages ? d.health.corpus_passages.toLocaleString() : "—"
    }</b> passages`;
  })
  .catch((e) => {
    const msg = `<span class="score-nums">No benchmark artifact yet (${e.message}). Run <code>python bench/run.py --url &lt;deployed-url&gt;</code>, or trigger the <code>benchmark</code> GitHub Action so it runs from a US runner.</span>`;
    $("slo").innerHTML = msg;
    $("stages").innerHTML = "";
    $("langs").innerHTML = "";
    $("verdict").textContent = "not yet measured";
  });
</script>
</body>
</html>
