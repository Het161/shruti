<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F2F1ED" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131313" media="(prefers-color-scheme: dark)">
<title>SHRUTI — heard, retrieved, answered</title>
<meta name="description" content="Voice-first, Indic-first grounded retrieval. Every query's latency budget shown as a measured waterfall.">
<link rel="stylesheet" href="/styles.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='13' font-size='13'>◉</text></svg>">
</head>
<body>
<div class="shell">

  <header class="masthead">
    <span class="wordmark">SHRUTI<span class="dev">·</span></span>
    <span class="tagline">Heard. Retrieved. Answered — with the stopwatch showing.</span>
    <nav class="pages">
      <a href="/" aria-current="page">Instrument</a>
      <a href="/method.html">Method</a>
      <a href="/bench.html">Bench</a>
    </nav>
  </header>

  <!-- ------------------------------------------------------------- input -->
  <section class="panel">
    <div class="panel-label">Query</div>
    <div class="console">
      <input id="q" type="text" autocomplete="off" spellcheck="false"
             placeholder="Ask in Hindi, Gujarati, Bengali, Tamil, or English…">
      <button class="mic" id="mic" data-recording="false" title="Hold to speak">● Speak</button>
      <button id="go">Ask</button>
    </div>

    <canvas class="wave hidden" id="wave" height="46" aria-hidden="true"></canvas>
    <div class="transcript-live hidden" id="live"></div>

    <!-- Sample queries. A judge evaluating this will not type Gujarati or Tamil, and a demo that
         can only be exercised by someone who speaks the language demos nothing. Each chip is a
         real query from the indexed corpus, plus two that are deliberately out of scope. -->
    <div class="samples" id="samples"></div>

    <div class="toggles">
      <label class="toggle">Lane
        <select id="lane">
          <option value="fast">fast · potion 256d</option>
          <option value="quality" disabled>quality · e5 384d — needs 384d corpus</option>
        </select>
      </label>
      <label class="toggle">Search
        <select id="mode">
          <option value="hnsw">hnsw · approximate</option>
          <option value="exact">exact · brute force</option>
        </select>
      </label>
      <label class="toggle">Tier 2
        <select id="gen">
          <option value="off">off · extractive only</option>
          <option value="on">on · streamed</option>
        </select>
      </label>
    </div>
  </section>

  <!-- ------------------------------------------ SIGNATURE №1 — waterfall -->
  <section class="panel hidden" id="timing-panel">
    <div class="panel-label">Latency · server-measured</div>
    <div class="reading">
      <div class="reading-total"><span id="total">—</span><span class="unit">ms</span></div>
      <div class="reading-meta" id="timing-meta"></div>
    </div>
    <div class="waterfall" id="waterfall"></div>
    <div class="legend" id="legend"></div>
  </section>

  <!-- ------------------------------------------------------------ answer -->
  <section class="panel hidden" id="answer-panel">
    <div class="panel-label">
      Answer
      <span class="lamp" id="lamp" data-state="idle"><span class="bulb"></span><span id="lamp-text">idle</span></span>
    </div>
    <div class="answer-tier" id="tier">Tier 1 · extractive · grounded by construction</div>
    <div class="answer" id="answer"></div>
    <div class="badges" id="badges"></div>
    <div class="refusal-reason hidden" id="refusal">
      <div class="gate" id="refusal-gate"></div>
      <div id="refusal-text"></div>
    </div>
  </section>

  <!-- ---------------------------------------------------------- passages -->
  <section class="panel hidden" id="passages-panel">
    <div class="panel-label">Retrieved passages</div>
    <div id="passages"></div>
  </section>

  <div class="status-strip" id="status">connecting…</div>
  <div class="status-strip" id="status2"></div>
</div>

<script src="/app.js"></script>
</body>
</html>
