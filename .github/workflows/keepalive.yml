name: keepalive

# This is a HEALTH CHECK, not a warm-keeper. The distinction matters and it changed once the
# hosting economics were worked out honestly.
#
# The deployment scales to zero. A ping only keeps a container warm if the scaledown window
# outlasts the ping interval — at which point the container never scales down and costs exactly
# what pinning it costs. There is no free middle ground, so pretending a cron job is a
# cost-free warmer would be self-deception.
#
# Warming is therefore a deliberate act before the demo:
#     MIN_CONTAINERS=1 modal deploy deploy/modal_app.py
#
# This job just verifies the service still answers, every 6 hours. Cold start is measured and
# reported as its own number in the benchmark artifact, never blended into query latency.

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        env:
          URL: ${{ vars.SHRUTI_URL }}
        run: |
          if [ -z "$URL" ]; then
            echo "SHRUTI_URL repository variable not set; skipping"
            exit 0
          fi
          code=$(curl -s -o /tmp/health.json -w "%{http_code}" --max-time 120 "$URL/api/health")
          echo "HTTP $code"
          cat /tmp/health.json
          # A warming instance is a success: it means the ping did its job.
          if [ "$code" != "200" ]; then exit 1; fi
