<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 300" width="940" height="300" role="img" aria-label="Two-tier answer timeline: Tier 1 extractive at 19ms, Tier 2 generative at 477ms time-to-first-token">
  <title>Why the answer arrives in two tiers</title>
  <desc>Tier 1 extractive completes at 19ms, inside the 200ms SLO. Tier 2 generation first token arrives at 477ms, outside it.</desc>

  <defs>
    <linearGradient id="t1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4ade80"/><stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="t2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#A78BFA"/><stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="rr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b"/><stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
  </defs>

  <rect width="940" height="300" fill="#070a14"/>

  <text x="30" y="32" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11"
        letter-spacing="2.4" fill="#8B8984">WHY TWO TIERS — MEASURED, NOT ASSUMED</text>

  <!-- time axis: 0 to 1400ms mapped onto x 30..910 -->
  <line x1="30" y1="250" x2="910" y2="250" stroke="#2a2a28"/>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9.5" fill="#575751">
    <text x="30"  y="268">0</text>
    <text x="156" y="268">200ms</text>
    <text x="282" y="268">400</text>
    <text x="533" y="268">800</text>
    <text x="784" y="268">1200</text>
  </g>

  <!-- the SLO wall at 200ms -->
  <line x1="156" y1="60" x2="156" y2="250" stroke="#C4321E" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="162" y="74" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10.5"
        fill="#C4321E">200 ms SLO — answer must be visible left of this line</text>

  <!-- TIER 1 -->
  <text x="30" y="106" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" fill="#4ade80">TIER 1 · EXTRACTIVE</text>
  <rect x="30" y="116" width="0" height="24" rx="2" fill="url(#t1)">
    <animate attributeName="width" from="0" to="12" dur="0.5s" begin="0.2s" fill="freeze"/>
  </rect>
  <g opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.7s" fill="freeze"/>
    <text x="50" y="133" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" fill="#F1F1F3">19 ms
      <tspan fill="#8B8984"> — grounded by construction, cited, done</tspan></text>
  </g>

  <!-- TIER 2 generation -->
  <text x="30" y="176" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" fill="#A78BFA">TIER 2 · GENERATIVE (Groq)</text>
  <rect x="30" y="186" width="0" height="24" rx="2" fill="url(#t2)" opacity="0.35">
    <animate attributeName="width" from="0" to="300" dur="1.1s" begin="1.2s" fill="freeze"/>
  </rect>
  <g opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="2.3s" fill="freeze"/>
    <circle cx="330" cy="198" r="4" fill="#A78BFA"/>
    <text x="344" y="202" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" fill="#F1F1F3">477 ms
      <tspan fill="#8B8984"> first token — 2.4× past the entire budget</tspan></text>
  </g>

  <!-- TIER 2 + rerank -->
  <text x="30" y="234" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10.5" fill="#f59e0b">+ RERANK (optional)</text>
  <rect x="185" y="220" width="0" height="16" rx="2" fill="url(#rr)" opacity="0.5">
    <animate attributeName="width" from="0" to="352" dur="0.9s" begin="2.6s" fill="freeze"/>
  </rect>
  <g opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="3.5s" fill="freeze"/>
    <text x="548" y="233" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10.5" fill="#8B8984">
      +561 ms → <tspan fill="#f59e0b">+60% MRR@10</tspan></text>
  </g>

  <!-- verdict -->
  <g opacity="0" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10.5">
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="3.9s" fill="freeze"/>
    <text x="30" y="292" fill="#8B8984">Retrieve-then-generate cannot meet 200 ms. That is arithmetic, not tuning — so Tier 1 ships first and Tier 2 only ever improves on an answer the user already has.</text>
  </g>
</svg>
