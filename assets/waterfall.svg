<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 250" width="940" height="250" role="img" aria-label="SHRUTI latency waterfall: 8 stages totalling 19.93 milliseconds server-measured">
  <title>SHRUTI — measured latency waterfall, 19.93 ms</title>
  <desc>Animated breakdown of one query on the deployed system. BM25 dominates at 14.85 ms of 19.93 ms.</desc>

  <defs>
    <linearGradient id="trace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#0e7c86"/>
    </linearGradient>
    <linearGradient id="heavy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#1c4d33"/>
    </linearGradient>
    <!-- Sweep highlight that travels the bar once every cycle, so the graphic reads as a live
         instrument rather than a static chart. -->
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="barclip"><rect x="30" y="86" width="880" height="42" rx="2"/></clipPath>
  </defs>

  <rect width="940" height="250" fill="#070a14"/>

  <text x="30" y="34" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11"
        letter-spacing="2.4" fill="#8B8984">LATENCY · SERVER-MEASURED · DEPLOYED</text>

  <text x="30" y="70" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="30"
        font-weight="600" fill="#F1F1F3">19.93<tspan font-size="13" fill="#8B8984" dx="4">ms</tspan></text>
  <text x="910" y="70" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,monospace"
        font-size="11" fill="#8B8984">310,582 passages · 5 languages · P100 111 ms</text>

  <rect x="30" y="86" width="880" height="42" fill="none" stroke="#2a2a28" rx="2"/>

  <!-- Segments. Widths are proportional to the real measured durations; the four sub-0.1ms gates
       are floored at 6px so a stage that ran is never invisible. -->
  <g clip-path="url(#barclip)">
    <rect x="30"  y="86" width="0" height="42" fill="url(#trace)" opacity="0.55">
      <animate attributeName="width" from="0" to="6"   dur="0.12s" begin="0s"    fill="freeze"/></rect>
    <rect x="36"  y="86" width="0" height="42" fill="url(#trace)" opacity="0.55">
      <animate attributeName="width" from="0" to="6"   dur="0.12s" begin="0.12s" fill="freeze"/></rect>
    <rect x="42"  y="86" width="0" height="42" fill="url(#trace)" opacity="0.75">
      <animate attributeName="width" from="0" to="17"  dur="0.16s" begin="0.24s" fill="freeze"/></rect>
    <rect x="59"  y="86" width="0" height="42" fill="url(#trace)">
      <animate attributeName="width" from="0" to="66"  dur="0.28s" begin="0.40s" fill="freeze"/></rect>
    <rect x="125" y="86" width="0" height="42" fill="url(#heavy)">
      <animate attributeName="width" from="0" to="650" dur="1.05s" begin="0.68s" fill="freeze"/></rect>
    <rect x="775" y="86" width="0" height="42" fill="url(#trace)" opacity="0.55">
      <animate attributeName="width" from="0" to="6"   dur="0.10s" begin="1.73s" fill="freeze"/></rect>
    <rect x="781" y="86" width="0" height="42" fill="url(#trace)" opacity="0.55">
      <animate attributeName="width" from="0" to="6"   dur="0.10s" begin="1.83s" fill="freeze"/></rect>
    <rect x="787" y="86" width="0" height="42" fill="url(#trace)">
      <animate attributeName="width" from="0" to="123" dur="0.40s" begin="1.93s" fill="freeze"/></rect>

    <rect x="-260" y="86" width="260" height="42" fill="url(#sweep)">
      <animate attributeName="x" from="-260" to="940" dur="2.6s" begin="2.4s"
               repeatCount="indefinite"/></rect>
  </g>

  <!-- Legend -->
  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10.5" fill="#8B8984">
    <g opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="2.35s" fill="freeze"/>
      <rect x="30"  y="152" width="7" height="7" fill="url(#trace)" opacity="0.55"/>
      <text x="43"  y="159">SAFETY <tspan fill="#F1F1F3">0.03</tspan></text>
      <rect x="140" y="152" width="7" height="7" fill="url(#trace)" opacity="0.55"/>
      <text x="153" y="159">DETECT <tspan fill="#F1F1F3">0.02</tspan></text>
      <rect x="250" y="152" width="7" height="7" fill="url(#trace)" opacity="0.75"/>
      <text x="263" y="159">EMBED <tspan fill="#F1F1F3">0.38</tspan></text>
      <rect x="360" y="152" width="7" height="7" fill="url(#trace)"/>
      <text x="373" y="159">DENSE <tspan fill="#F1F1F3">1.52</tspan></text>
      <rect x="470" y="152" width="7" height="7" fill="url(#heavy)"/>
      <text x="483" y="159">BM25 <tspan fill="#4ade80">14.85</tspan></text>
      <rect x="580" y="152" width="7" height="7" fill="url(#trace)" opacity="0.55"/>
      <text x="593" y="159">FUSE <tspan fill="#F1F1F3">0.27</tspan></text>
      <rect x="690" y="152" width="7" height="7" fill="url(#trace)" opacity="0.55"/>
      <text x="703" y="159">SCOPE <tspan fill="#F1F1F3">0.05</tspan></text>
      <rect x="800" y="152" width="7" height="7" fill="url(#trace)"/>
      <text x="813" y="159">ANSWER <tspan fill="#F1F1F3">2.81</tspan></text>
    </g>
  </g>

  <line x1="30" y1="182" x2="910" y2="182" stroke="#2a2a28"/>

  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10.5" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="2.6s" fill="freeze"/>
    <text x="30" y="204" fill="#8B8984">BM25 is <tspan fill="#4ade80">74.5%</tspan> of the pipeline — the honest bottleneck, reported not hidden.</text>
    <text x="30" y="224" fill="#8B8984">Tier 1 is extractive: every character copied verbatim from a retrieved passage.</text>
    <text x="30" y="244" fill="#8B8984">Hallucination is not mitigated here. It is <tspan fill="#F1F1F3">impossible</tspan>.</text>
  </g>
</svg>
